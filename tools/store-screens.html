<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- One Play Store screenshot, 1080 x 1920. tools\store-screens.ps1 fills in the {{...}} and has
     Edge draw it. -->
<style>
  @font-face { font-family: "Geist"; font-weight: 400; src: url("data:font/ttf;base64,{{GEIST_400}}"); }
  @font-face { font-family: "Geist"; font-weight: 600; src: url("data:font/ttf;base64,{{GEIST_600}}"); }
  @font-face { font-family: "Geist"; font-weight: 700; src: url("data:font/ttf;base64,{{GEIST_700}}"); }

  /* The screen's accent: a bright and a deep colour, as r, g, b. */
  :root { --a1: {{A1}}; --a2: {{A2}}; }

  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 118px;
    font-family: "Geist", sans-serif;
    background:
      radial-gradient(ellipse 900px 640px at 50% 14%, rgba(var(--a1), .30), transparent 70%),
      radial-gradient(ellipse 1200px 900px at 50% 96%, rgba(var(--a2), .32), transparent 70%),
      linear-gradient(180deg, #0B0E22 0%, #090B18 55%, #06070D 100%);
  }
  #sky { position: absolute; inset: 0; }

  /* A faint band across the sky, like the Milky Way's: decoration, not a photo. */
  .band {
    position: absolute; left: -320px; top: 260px; width: 1720px; height: 560px;
    transform: rotate(-26deg);
    background: radial-gradient(ellipse at center, rgba(200, 210, 255, .09), transparent 68%);
    filter: blur(24px);
  }

  .icon {
    position: relative; flex: none; width: 168px; height: 168px; border-radius: 50px;
    display: grid; place-items: center;
    background: linear-gradient(140deg, rgb(var(--a1)), rgb(var(--a2)));
    box-shadow:
      inset 0 0 0 2px rgba(255, 255, 255, .22),
      0 18px 50px rgba(var(--a2), .45),
      0 0 150px rgba(var(--a1), .55);
  }
  .icon svg { width: 100px; height: 100px; fill: #FFFFFF; }

  h1 {
    position: relative; flex: none; margin: 46px 0 0; max-width: 960px;
    text-align: center; text-wrap: balance;
    font-weight: 700; font-size: 104px; line-height: 1.04; letter-spacing: -0.03em;
    color: #F4F6FF;
  }
  h1 em { font-style: normal; color: rgb(var(--a1)); }

  /* The phone, larger than the canvas: it runs off the bottom edge. */
  .phone {
    position: relative; margin-top: 72px; flex: none;
    width: 860px; padding: 18px; border-radius: 78px;
    background: #06070B;
    box-shadow:
      inset 0 0 0 2px rgba(255, 255, 255, .10),
      0 0 0 1px rgba(var(--a1), .28),
      0 40px 120px rgba(0, 0, 0, .65),
      0 0 170px rgba(var(--a1), .24);
  }
  .phone img { display: block; width: 100%; border-radius: 60px; }
</style>
</head>
<body>
  <canvas id="sky" width="1080" height="1920"></canvas>
  <div class="band"></div>
  <div class="icon"><svg viewBox="0 0 24 24">{{ICON}}</svg></div>
  <h1>{{TITLE}}</h1>
  <div class="phone"><img src="{{SHOT}}"></div>
<script>
  // Stars, from a seed: the same picture on every run.
  (function () {
    let s = {{SEED}};
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const c = document.getElementById('sky').getContext('2d');
    for (let i = 0; i < 320; i++) {
      const x = rnd() * 1080, y = rnd() * 1920, m = Math.pow(rnd(), 3);
      const r = 0.6 + 1.8 * m, a = 0.25 + 0.7 * m;
      if (m > 0.6) {
        const g = c.createRadialGradient(x, y, 0, x, y, r * 7);
        g.addColorStop(0, 'rgba(200, 215, 255, ' + (0.35 * a) + ')');
        g.addColorStop(1, 'rgba(200, 215, 255, 0)');
        c.fillStyle = g;
        c.beginPath(); c.arc(x, y, r * 7, 0, 7); c.fill();
      }
      c.fillStyle = 'rgba(' + (rnd() < 0.3 ? '170, 200, 255' : '235, 240, 255') + ', ' + a + ')';
      c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    }
  })();
</script>
</body>
</html>
