<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StarCam · Cover the lens</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@300..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:#7FB4FF}a:hover{color:#A9CCFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 866px; overflow: hidden; background: #0A0B10; font-family: 'Geist', system-ui, sans-serif; color: #E8ECF4; font-variant-numeric: tabular-nums">

<div role="progressbar" aria-label="Session step 5 of 7: dark frames" aria-valuemin="1" aria-valuemax="7" aria-valuenow="5" style="position: absolute; top: 18px; left: 14px; right: 14px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(127,180,255,0.5)"></div><span style="font-size: 12px; color: #AEB6C7">Still</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(127,180,255,0.5)"></div><span style="font-size: 12px; color: #AEB6C7">Sky</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(127,180,255,0.5)"></div><span style="font-size: 12px; color: #AEB6C7">Focus</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(127,180,255,0.5)"></div><span style="font-size: 12px; color: #AEB6C7">Capture</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: #7FB4FF; box-shadow: 0 0 8px rgba(127,180,255,0.7)"></div><span style="font-size: 12px; font-weight: 600; color: #E8ECF4">Darks</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(170,190,230,0.18)"></div><span style="font-size: 12px; color: #8891A5">Stack</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(170,190,230,0.18)"></div><span style="font-size: 12px; color: #8891A5">Done</span></div>
</div>

<svg width="260" height="230" viewBox="0 0 260 230" role="img" aria-label="A gloved hand covering the phone's camera" style="position: absolute; top: 92px; left: 65px">
<circle cx="130" cy="112" r="104" fill="none" stroke="rgba(170,190,230,0.07)" stroke-width="1"></circle>
<circle cx="130" cy="112" r="78" fill="none" stroke="rgba(170,190,230,0.05)" stroke-width="1"></circle>
<rect x="72" y="18" width="124" height="200" rx="24" fill="#10131B" stroke="rgba(170,190,230,0.42)" stroke-width="2"></rect>
<rect x="86" y="32" width="48" height="82" rx="15" fill="#0C0E15" stroke="rgba(170,190,230,0.42)" stroke-width="2"></rect>
<circle cx="110" cy="55" r="12" fill="none" stroke="rgba(170,190,230,0.42)" stroke-width="2"></circle>
<circle cx="110" cy="91" r="12" fill="none" stroke="rgba(170,190,230,0.42)" stroke-width="2"></circle>
<path d="M98 34 C98 24 106 18 118 18 L160 18 C176 18 186 30 186 46 L186 106 C186 122 174 132 158 132 L128 132 C120 132 114 128 110 122 L92 98 C86 90 88 80 96 78 C100 77 104 79 106 82 L106 82 L98 66 Z" fill="rgba(127,180,255,0.10)" stroke="#7FB4FF" stroke-width="2" stroke-linejoin="round"></path>
<path d="M186 40 L208 40 C214 40 218 44 218 50 L218 102 C218 108 214 112 208 112 L186 112" fill="rgba(127,180,255,0.06)" stroke="#7FB4FF" stroke-width="2" stroke-linejoin="round"></path>
<path d="M196 48 V104 M206 48 V104" stroke="rgba(127,180,255,0.45)" stroke-width="1.5" stroke-linecap="round"></path>
<path d="M124 44 C130 40 140 40 146 44 M124 64 C132 60 144 60 152 64" stroke="rgba(127,180,255,0.4)" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
</svg>

<h1 style="position: absolute; top: 346px; left: 24px; right: 24px; margin: 0; text-align: center; font-size: 30px; font-weight: 600; letter-spacing: -0.02em">Cover the lens</h1>
<p style="position: absolute; top: 392px; left: 34px; right: 34px; margin: 0; text-align: center; font-size: 15px; line-height: 1.5; color: #AEB6C7">Put your hand, glove or lens cap over the camera. StarCam takes 10 dark frames to remove hot pixels.</p>

<div style="position: absolute; top: 484px; left: 50%; margin-left: -68px; width: 136px; height: 136px">
<svg width="136" height="136" viewBox="0 0 136 136" aria-hidden="true" style="position: absolute; inset: 0">
<circle cx="68" cy="68" r="60" fill="#10121A" stroke="rgba(170,190,230,0.14)" stroke-width="6"></circle>
<circle cx="68" cy="68" r="60" fill="none" stroke="#7FB4FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="295 377" transform="rotate(-90 68 68)" style="filter: drop-shadow(0 0 6px rgba(127,180,255,0.6))"></circle>
</svg>
<div role="timer" aria-label="Auto-skips in 47 seconds" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span class="mono" style="font-size: 40px; font-weight: 300; line-height: 1">47<span style="font-size: 18px; color: #AEB6C7"> s</span></span>
<span style="font-size: 12px; color: #8891A5; margin-top: 4px">auto-skips</span>
</div>
</div>

<div style="position: absolute; top: 636px; left: 20px; right: 20px; text-align: center">
<div style="font-size: 14px; color: #DCE3EF">Dark frames <span class="mono">0 / 10</span></div>
<div style="font-size: 13px; color: #8891A5; margin-top: 6px">Covered? It starts by itself when the frame goes dark.</div>
</div>

<button style="position: absolute; left: 14px; right: 14px; bottom: 88px; height: 56px; border-radius: 18px; background: #24426F; border: 1px solid rgba(127,180,255,0.55); box-shadow: 0 8px 24px rgba(40,90,170,0.25); font-size: 16px; font-weight: 600; color: #E3EEFF">Lens covered</button>
<button style="position: absolute; left: 14px; right: 14px; bottom: 24px; height: 56px; border-radius: 18px; background: #161925; border: 1px solid rgba(170,190,230,0.18); font-size: 16px; font-weight: 600">Skip dark frames</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":866}}'>

</body>
</html>
