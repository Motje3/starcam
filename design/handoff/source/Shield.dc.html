<span style="font-size: 14px; letter-spacing: 0.02em">double-tap to show</span>
</button>

<div style="width: 38%; height: 2px; border-radius: 1px; background: rgba(127,180,255,0.32)"></div>
</div>

</div>
</x-dc>
