<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StarCam · Capture idle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

</style>
</helmet>
<div style="position: relative; width: 390px; height: 866px; overflow: hidden; background: #0A0B10; font-family: 'Geist', system-ui, sans-serif; color: #E8ECF4; font-variant-numeric: tabular-nums">

<span style="width: 8px; height: 8px; border-radius: 50%; background: #7FB4FF; box-shadow: 0 0 8px rgba(127,180,255,0.7)"></span>
<span>Battery 86% · cool</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8891A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>

<button class="mono" aria-pressed="true" style="width: 58px; height: 42px; border-radius: 999px; font-size: 14px; font-weight: 600; color: #CFE2FF; background: rgba(127,180,255,0.18); border: 1px solid rgba(127,180,255,0.55); box-shadow: 0 0 14px rgba(127,180,255,0.22)">0.3×</button>
</div>
</div>

<div style="position: absolute; top: 72px; left: 14px; width: 362px; height: 483px; border-radius: 24px; overflow: hidden; border: 1px solid rgba(170,190,230,0.12); background: #05060A">
<img src="/_blob/466aef7d188d3ef5e8fb5c081f0ef07c" alt="Live preview: the Milky Way rising over mountains and a lake" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div style="position: absolute; top: 0; bottom: 0; left: 33.33%; width: 1px; background: rgba(232,236,244,0.07)"></div>

<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3C12.8 9 15 11.2 21 12C15 12.8 12.8 15 12 21C11.2 15 9 12.8 3 12C9 11.2 11.2 9 12 3Z" fill="#7FB4FF"></path></svg>

<button aria-label="Dismiss tip" style="flex: none; width: 44px; height: 44px; margin: -10px -2px -10px 0; display: flex; align-items: center; justify-content: center; color: #AEB6C7">

</button>
</div>
</sc-if>
</div>

<button role="radio" aria-checked="true" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 18px; background: rgba(127,180,255,0.15); border: 1px solid rgba(127,180,255,0.5); color: #CFE2FF; box-shadow: inset 0 0 18px rgba(127,180,255,0.12); font-size: 12px; font-weight: 600; letter-spacing: 0.08em">

<span style="position: absolute; top: 5px; right: 5px; padding: 1px 5px; border-radius: 6px; border: 1px solid rgba(255,198,110,0.4); color: #FFC66E; font-size: 9px; letter-spacing: 0.06em">BETA</span>

<button role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 18px; border: 1px solid transparent; color: #AEB6C7; font-size: 12px; font-weight: 600; letter-spacing: 0.08em">

<button role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 18px; background: #12141C; border: 1px solid rgba(170,190,230,0.12)">

<button role="radio" aria-checked="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 18px; background: rgba(127,180,255,0.15); border: 1px solid rgba(127,180,255,0.5); box-shadow: inset 0 0 18px rgba(127,180,255,0.12)">

</div>
