<p style="position: absolute; top: 584px; left: 28px; right: 32px; margin: 0; font-size: 16px; line-height: 1.55; color: #AEB6C7">At the end, StarCam asks for a few frames with the lens covered. They remove hot pixels. Your hand or glove is fine. If you miss it, it skips after 60 seconds.</p>
