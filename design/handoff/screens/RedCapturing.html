<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StarCam · Night vision capturing</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@300..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120404}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:#FF5544}a:hover{color:#FF5544}
</style>
<div style="position: relative; width: 390px; height: 866px; overflow: hidden; background: #120404; font-family: 'Geist', system-ui, sans-serif; color: #FF5544; font-variant-numeric: tabular-nums; filter: brightness(1)">

<div role="progressbar" aria-label="Session step 4 of 7: capturing" aria-valuemin="1" aria-valuemax="7" aria-valuenow="4" style="position: absolute; top: 18px; left: 14px; right: 14px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(255,85,68,0.5)"></div><span style="font-size: 12px; color: #D9483A">Still</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(255,85,68,0.5)"></div><span style="font-size: 12px; color: #D9483A">Sky</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(255,85,68,0.5)"></div><span style="font-size: 12px; color: #D9483A">Focus</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: linear-gradient(90deg, #FF5544 0%, #FF5544 32%, rgba(255,85,68,0.18) 32%)"></div><span style="font-size: 12px; font-weight: 600; color: #FF5544">Capture</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(255,85,68,0.18)"></div><span style="font-size: 12px; color: #D9483A">Darks</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(255,85,68,0.18)"></div><span style="font-size: 12px; color: #D9483A">Stack</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(255,85,68,0.18)"></div><span style="font-size: 12px; color: #D9483A">Done</span></div>
</div>

<div style="position: absolute; top: 70px; left: 14px; width: 362px; height: 322px; border-radius: 22px; overflow: hidden; border: 1px solid rgba(255,85,68,0.2); background: #0A0202">
<img src="../assets/sky.svg" alt="Live stacked preview in red tones" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; filter: grayscale(1) brightness(0.85) contrast(1.15)">
<div style="position: absolute; inset: 0; background: #FF3B2A; mix-blend-mode: multiply"></div>
<div style="position: absolute; top: 12px; left: 12px; height: 30px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-radius: 999px; background: rgba(18,4,4,0.8); border: 1px solid rgba(255,85,68,0.35); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #FF5544">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF5544" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
LIVE STACK · <span class="mono">6</span> FRAMES
</div>
<div style="position: absolute; top: 12px; right: 12px; height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 999px; background: rgba(18,4,4,0.8); border: 1px solid rgba(255,85,68,0.3); font-size: 12px; color: #FF5544">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FF5544" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"></path></svg>
<span class="mono">Dim 40%</span>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(180deg, rgba(10,2,2,0) 0%, rgba(10,2,2,0.9) 100%)"></div>
<div class="mono" style="position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; justify-content: space-between; font-size: 12px; color: #FF5544">
<span>stars 312</span>
<span>FWHM 1.6 px</span>
<span>drift 0.4 px</span>
</div>
</div>

<div style="position: absolute; top: 406px; left: 20px; right: 20px; height: 24px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #FF5544">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #FF5544; box-shadow: 0 0 0 4px rgba(255,85,68,0.18)"></span>
<span>Exposing frame 7 — hands off the tripod</span>
</div>

<div style="position: absolute; top: 444px; left: 20px; width: 180px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #D9483A">FRAME</div>
<div class="mono" style="font-size: 76px; font-weight: 300; line-height: 0.95; letter-spacing: -0.03em; margin-top: 4px">7<span style="font-size: 30px; color: #D9483A; letter-spacing: 0"> / 20</span></div>
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #D9483A; margin-top: 18px">TIME LEFT</div>
<div class="mono" style="font-size: 26px; font-weight: 400; margin-top: 4px">~5 min 12 s</div>
</div>

<div style="position: absolute; top: 446px; right: 18px; width: 156px; height: 156px">
<svg width="156" height="156" viewBox="0 0 156 156" aria-hidden="true" style="position: absolute; inset: 0">
<circle cx="78" cy="78" r="68" fill="#170606" stroke="rgba(255,85,68,0.16)" stroke-width="7"></circle>
<circle cx="78" cy="78" r="68" fill="none" stroke="#FF5544" stroke-width="7" stroke-linecap="round" stroke-dasharray="266 428" transform="rotate(-90 78 78)"></circle>
</svg>
<div role="timer" aria-label="Exposing 14 of 22.5 seconds" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #D9483A">EXPOSING</span>
<span class="mono" style="font-size: 36px; font-weight: 400; line-height: 1.1">14.0</span>
<span class="mono" style="font-size: 13px; color: #D9483A">/ 22.5 s</span>
</div>
</div>

<div style="position: absolute; top: 630px; left: 20px; right: 20px">
<div aria-label="Frames: 6 kept, frame 7 in progress, 13 to go" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px">
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.7)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.7)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.7)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.45)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.7)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.7)"></span>
<span style="height: 18px; border-radius: 3px; border: 1.5px solid #FF5544; box-sizing: border-box; background: linear-gradient(0deg, rgba(255,85,68,0.6) 0%, rgba(255,85,68,0.6) 62%, transparent 62%)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
<span style="height: 18px; border-radius: 3px; background: rgba(255,85,68,0.14)"></span>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #D9483A">
<span><span class="mono" style="color: #FF5544">6</span> kept · <span class="mono" style="color: #FF5544">0</span> rejected</span>
<span>Battery <span class="mono" style="color: #FF5544">84%</span> · cool</span>
</div>
</div>

<div style="position: absolute; left: 14px; right: 14px; bottom: 24px; display: grid; grid-template-columns: 100px minmax(0, 1fr) 76px; gap: 8px">
<button style="height: 60px; border-radius: 18px; background: #1C0807; border: 1px solid rgba(255,85,68,0.22); font-size: 15px; font-weight: 600; color: #FF5544">Cancel</button>
<button style="height: 60px; border-radius: 18px; background: rgba(255,85,68,0.12); border: 1px solid rgba(255,85,68,0.5); font-size: 15px; font-weight: 600; color: #FF5544">Finish &amp; stack now</button>
<button style="height: 60px; border-radius: 18px; background: #1C0807; border: 1px solid rgba(255,85,68,0.22); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: #D9483A">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF5544" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"></rect><path d="M13.6 9a3.2 3.2 0 1 0 1.9 5.6A3.6 3.6 0 0 1 13.6 9z"></path></svg>
Shield
</button>
</div>

</div>
</body>
</html>
