StarCam

<h1 style="position: absolute; top: 300px; left: 28px; right: 28px; margin: 0; text-align: center; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Allow camera access</h1>
<p style="position: absolute; top: 346px; left: 34px; right: 34px; margin: 0; text-align: center; font-size: 15px; line-height: 1.55; color: #AEB6C7">StarCam needs the camera to take long exposures of the sky. Your photos stay on your phone.</p>

<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="perm-title" style="position: absolute; left: 20px; right: 20px; bottom: 28px; padding: 24px 20px 20px; border-radius: 28px; background: #1D1F27; border: 1px solid rgba(170,190,230,0.10); box-shadow: 0 20px 60px rgba(0,0,0,0.6)">
<div style="display: flex; justify-content: center">

<button style="height: 52px; border-radius: 26px; background: #2B3550; font-size: 15px; font-weight: 600; color: #CFE2FF">While using the app</button>
<button style="height: 52px; border-radius: 26px; background: #262935; font-size: 15px; font-weight: 500; color: #DCE3EF">Only this time</button>
<button style="height: 52px; border-radius: 26px; background: #262935; font-size: 15px; font-weight: 500; color: #DCE3EF">Don’t allow</button>
