<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StarCam · Star focus</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@300..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:#7FB4FF}a:hover{color:#A9CCFF}
</style>
<div style="position: relative; width: 390px; height: 866px; overflow: hidden; background: #0A0B10; font-family: 'Geist', system-ui, sans-serif; color: #E8ECF4; font-variant-numeric: tabular-nums">

<div role="progressbar" aria-label="Session step 3 of 7: star focus" aria-valuemin="1" aria-valuemax="7" aria-valuenow="3" style="position: absolute; top: 18px; left: 14px; right: 14px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(127,180,255,0.5)"></div><span style="font-size: 12px; color: #AEB6C7">Still</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(127,180,255,0.5)"></div><span style="font-size: 12px; color: #AEB6C7">Sky</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: #7FB4FF; box-shadow: 0 0 8px rgba(127,180,255,0.7)"></div><span style="font-size: 12px; font-weight: 600; color: #E8ECF4">Focus</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(170,190,230,0.18)"></div><span style="font-size: 12px; color: #8891A5">Capture</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(170,190,230,0.18)"></div><span style="font-size: 12px; color: #8891A5">Darks</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(170,190,230,0.18)"></div><span style="font-size: 12px; color: #8891A5">Stack</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: rgba(170,190,230,0.18)"></div><span style="font-size: 12px; color: #8891A5">Done</span></div>
</div>

<div role="img" aria-label="Magnified star used for focusing" style="position: absolute; top: 70px; left: 14px; width: 362px; height: 290px; border-radius: 22px; overflow: hidden; border: 1px solid rgba(170,190,230,0.12); background: radial-gradient(circle at 50% 45%, #0E1222 0%, #05060A 70%)">
<div style="position: absolute; left: 181px; top: 120px; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: radial-gradient(circle, #FFFFFF 0%, rgba(235,242,255,0.95) 12%, rgba(190,210,255,0.45) 32%, rgba(127,160,255,0.12) 58%, rgba(127,160,255,0) 72%)"></div>
<div style="position: absolute; left: 70px; top: 60px; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(200,215,255,0.2) 45%, rgba(200,215,255,0) 70%)"></div>
<div style="position: absolute; left: 292px; top: 205px; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: radial-gradient(circle, rgba(255,236,214,0.8) 0%, rgba(255,220,190,0.2) 45%, rgba(255,220,190,0) 70%)"></div>
<div style="position: absolute; left: 120px; top: 230px; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%)"></div>
<div style="position: absolute; left: 141px; top: 80px; width: 80px; height: 80px; border: 1px solid rgba(127,180,255,0.0)">
<span style="position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-top: 1.5px solid #7FB4FF; border-left: 1.5px solid #7FB4FF"></span>
<span style="position: absolute; top: 0; right: 0; width: 14px; height: 14px; border-top: 1.5px solid #7FB4FF; border-right: 1.5px solid #7FB4FF"></span>
<span style="position: absolute; bottom: 0; left: 0; width: 14px; height: 14px; border-bottom: 1.5px solid #7FB4FF; border-left: 1.5px solid #7FB4FF"></span>
<span style="position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-bottom: 1.5px solid #7FB4FF; border-right: 1.5px solid #7FB4FF"></span>
</div>
<div style="position: absolute; top: 12px; left: 12px; height: 30px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-radius: 999px; background: rgba(10,11,16,0.68); border: 1px solid rgba(170,190,230,0.16); font-size: 12px; color: #DCE3EF">Brightest star · <span class="mono">8× crop</span></div>
<div class="mono" style="position: absolute; top: 12px; right: 12px; height: 30px; padding: 0 12px; display: flex; align-items: center; border-radius: 999px; background: rgba(10,11,16,0.68); border: 1px solid rgba(127,180,255,0.35); font-size: 12px; color: #CFE2FF">FWHM 1.9 px</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<div style="height: 44px; border-radius: 10px; background: rgba(10,11,16,0.7); border: 1px solid rgba(170,190,230,0.14); display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span style="width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle, rgba(220,230,255,0.55) 0%, rgba(160,180,255,0.15) 55%, rgba(160,180,255,0) 72%)"></span><span class="mono" style="font-size: 12px; color: #8891A5">1</span></div>
<div style="height: 44px; border-radius: 10px; background: rgba(10,11,16,0.7); border: 1px solid rgba(170,190,230,0.14); display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span style="width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle, rgba(235,240,255,0.8) 0%, rgba(160,180,255,0.2) 55%, rgba(160,180,255,0) 72%)"></span><span class="mono" style="font-size: 12px; color: #8891A5">2</span></div>
<div style="height: 44px; border-radius: 10px; background: rgba(127,180,255,0.12); border: 1px solid rgba(127,180,255,0.5); display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span style="width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle, #FFFFFF 0%, rgba(200,215,255,0.35) 55%, rgba(200,215,255,0) 72%)"></span><span class="mono" style="font-size: 12px; color: #CFE2FF">3 best</span></div>
<div style="height: 44px; border-radius: 10px; background: rgba(10,11,16,0.7); border: 1px solid rgba(232,236,244,0.4); display: flex; align-items: center; justify-content: space-between; padding: 0 10px"><span style="width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle, #FFFFFF 0%, rgba(200,215,255,0.3) 55%, rgba(200,215,255,0) 72%)"></span><span class="mono" style="font-size: 12px; color: #E8ECF4">4 now</span></div>
</div>
</div>

<div style="position: absolute; top: 380px; left: 20px; right: 20px; display: flex; align-items: flex-end; justify-content: space-between">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Star focus</h1>
<p style="margin: 6px 0 0; font-size: 14px; color: #AEB6C7"><span class="mono">~18 s</span> left</p>
</div>
<div style="text-align: right">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #8891A5">STEP</div>
<div class="mono" style="font-size: 44px; font-weight: 300; line-height: 1">4<span style="font-size: 22px; color: #8891A5"> / 10</span></div>
</div>
</div>
<p style="position: absolute; top: 452px; left: 20px; right: 28px; margin: 0; font-size: 15px; line-height: 1.5; color: #AEB6C7">Sweeping the lens and measuring star size. Smaller stars mean sharper focus.</p>

<div style="position: absolute; top: 518px; left: 14px; right: 14px; padding: 16px; border-radius: 22px; background: #12141C; border: 1px solid rgba(170,190,230,0.12)">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #AEB6C7">STAR SIZE BY FOCUS STEP</span>
<span style="font-size: 12px; color: #8891A5">lower is sharper</span>
</div>
<svg width="330" height="120" viewBox="0 0 330 120" role="img" aria-label="Star size: step 1 3.4 px, step 2 2.4 px, step 3 1.6 px, step 4 1.9 px" style="display: block; margin-top: 10px">
<path d="M20 100H320" stroke="rgba(170,190,230,0.16)" stroke-width="1"></path>
<path d="M20 82H320" stroke="rgba(127,180,255,0.4)" stroke-width="1" stroke-dasharray="3 4"></path>
<text x="320" y="77" text-anchor="end" font-size="11" fill="#A9CCFF" font-family="Geist Mono, monospace">best 1.6 px</text>
<path d="M120 73 C135 64 145 58 153 52 S175 36 187 31" fill="none" stroke="rgba(170,190,230,0.45)" stroke-width="1.5" stroke-dasharray="3 4"></path>
<path d="M20 28 C35 44 42 52 53 58 S75 80 87 82 S108 78 120 73" fill="none" stroke="#7FB4FF" stroke-width="2" stroke-linecap="round"></path>
<circle cx="20" cy="28" r="3.5" fill="#7FB4FF"></circle>
<circle cx="53.3" cy="58" r="3.5" fill="#7FB4FF"></circle>
<circle cx="86.7" cy="82" r="5" fill="#7FB4FF" style="filter: drop-shadow(0 0 5px rgba(127,180,255,0.9))"></circle>
<circle cx="120" cy="73" r="6" fill="#0A0B10" stroke="#E8ECF4" stroke-width="2"></circle>
<circle cx="153.3" cy="100" r="2" fill="rgba(170,190,230,0.35)"></circle>
<circle cx="186.7" cy="100" r="2" fill="rgba(170,190,230,0.35)"></circle>
<circle cx="220" cy="100" r="2" fill="rgba(170,190,230,0.35)"></circle>
<circle cx="253.3" cy="100" r="2" fill="rgba(170,190,230,0.35)"></circle>
<circle cx="286.7" cy="100" r="2" fill="rgba(170,190,230,0.35)"></circle>
<circle cx="320" cy="100" r="2" fill="rgba(170,190,230,0.35)"></circle>
<text x="20" y="116" font-size="11" fill="#8891A5" font-family="Geist, sans-serif">near</text>
<text x="320" y="116" text-anchor="end" font-size="11" fill="#8891A5" font-family="Geist, sans-serif">∞</text>
</svg>
</div>

<div style="position: absolute; left: 14px; right: 14px; bottom: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 56px; border-radius: 18px; background: #161925; border: 1px solid rgba(170,190,230,0.18); font-size: 16px; font-weight: 600">Cancel</button>
<button style="height: 56px; border-radius: 18px; background: #161925; border: 1px solid rgba(170,190,230,0.18); font-size: 15px; font-weight: 600; color: #CFE2FF">Use infinity</button>
</div>

</div>
</body>
</html>
