<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StarCam · Done</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@300..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:#7FB4FF}a:hover{color:#A9CCFF}
</style>
<div style="position: relative; width: 390px; height: 866px; overflow: hidden; background: #0A0B10; font-family: 'Geist', system-ui, sans-serif; color: #E8ECF4; font-variant-numeric: tabular-nums">

<img src="../assets/sky.svg" alt="Finished photo: the Milky Way over mountains and a lake" style="position: absolute; top: 0; left: 0; width: 390px; height: 480px; object-fit: cover; object-position: 50% 30%; filter: brightness(1.12) contrast(1.2) saturate(1.3)">
<div style="position: absolute; top: 340px; left: 0; width: 390px; height: 142px; background: linear-gradient(180deg, rgba(10,11,16,0) 0%, #0A0B10 100%)"></div>

<button aria-label="Back to camera" style="position: absolute; top: 14px; left: 14px; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(10,11,16,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(170,190,230,0.16)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8ECF4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<div style="position: absolute; top: 22px; right: 14px; height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border-radius: 999px; background: rgba(10,11,16,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(170,190,230,0.16); font-size: 12px; color: #DCE3EF">Look · Natural</div>

<div role="status" style="position: absolute; top: 386px; left: 14px; right: 14px; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 20px; background: rgba(14,16,24,0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(127,180,255,0.3)">
<span style="flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(127,180,255,0.18)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FB4FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<div style="flex: 1">
<div style="font-size: 15px; font-weight: 600">Saved to Gallery</div>
<div style="font-size: 12px; color: #AEB6C7; margin-top: 2px">Pictures / StarCam · 12 MP</div>
</div>
</div>

<div style="position: absolute; top: 474px; left: 14px; right: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="padding: 14px 12px; border-radius: 18px; background: #12141C; border: 1px solid rgba(170,190,230,0.10)">
<div class="mono" style="font-size: 22px">20/20</div>
<div style="font-size: 12px; color: #8891A5; margin-top: 4px">frames</div>
</div>
<div style="padding: 14px 12px; border-radius: 18px; background: #12141C; border: 1px solid rgba(170,190,230,0.10)">
<div class="mono" style="font-size: 22px">7m 30s</div>
<div style="font-size: 12px; color: #8891A5; margin-top: 4px">total exposure</div>
</div>
<div style="padding: 14px 12px; border-radius: 18px; background: #12141C; border: 1px solid rgba(170,190,230,0.10)">
<div class="mono" style="font-size: 22px">9 min</div>
<div style="font-size: 12px; color: #8891A5; margin-top: 4px">took</div>
</div>
</div>

<p style="position: absolute; top: 566px; left: 20px; right: 20px; margin: 0; font-size: 13px; color: #8891A5; text-align: center">20/20 frames · 7 min 30 s total exposure · took 9 min</p>

<button style="position: absolute; top: 600px; left: 14px; right: 14px; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px; border-radius: 18px; background: #0F1118; border: 1px solid rgba(170,190,230,0.12); text-align: left">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB6C7" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
<div style="flex: 1"><div style="font-size: 14px; font-weight: 500">Pro files</div><div style="font-size: 12px; color: #8891A5; margin-top: 1px">16-bit TIFF · 20 RAW DNG · 10 darks</div></div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8891A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>

<button style="position: absolute; left: 14px; right: 14px; bottom: 92px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 18px; background: #24426F; border: 1px solid rgba(127,180,255,0.55); box-shadow: 0 8px 24px rgba(40,90,170,0.25); font-size: 16px; font-weight: 600; color: #E3EEFF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="18.5" r="2.5"></circle><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"></path></svg>
Share
</button>
<div style="position: absolute; left: 14px; right: 14px; bottom: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 18px; background: #161925; border: 1px solid rgba(170,190,230,0.18); font-size: 15px; font-weight: 600">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"></path></svg>
Open
</button>
<button style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 18px; background: #161925; border: 1px solid rgba(170,190,230,0.18); font-size: 15px; font-weight: 600">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg>
Re-process
</button>
</div>

</div>
</body>
</html>
