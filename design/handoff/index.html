<!doctype html>

<title>StarCam design</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
body{margin:0;background:#0A0B10;color:#E8ECF4;font-family:'Geist',system-ui,sans-serif}
header{padding:40px 40px 8px}
h1{margin:0;font-size:32px;font-weight:600;letter-spacing:-0.02em}
header p{margin:6px 0 0;color:#AEB6C7;font-size:15px}
section{padding:28px 40px}
h2{margin:0 0 18px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8891A5}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
figure{margin:0}
figcaption{margin-top:10px;font-size:13px;color:#AEB6C7}
figcaption a{color:#7FB4FF;text-decoration:none;margin-left:6px}
figcaption a:hover{color:#A9CCFF}
.frame{width:234px;height:520px;overflow:hidden;border-radius:18px;border:1px solid rgba(170,190,230,.14);background:#0A0B10}
.frame iframe{width:390px;height:866px;border:0;transform:scale(.6);transform-origin:0 0}
.frame.tall{height:888px}.frame.tall iframe{height:1480px}
.frame.wide{width:768px;height:600px}.frame.wide iframe{width:1280px;height:1000px}
.frame.wider{width:960px;height:744px}.frame.wider iframe{width:1600px;height:1240px}
</style>
</head>
